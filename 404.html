<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — SmileCare Dental</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png" sizes="32x32" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-4);
      background: var(--color-bg);
    }
    .error-code {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(4rem, 14vw, 8rem);
      line-height: 1;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: var(--space-2);
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div>
      <div class="error-code">404</div>
      <h1 class="section-title mb-3">This Page Took a Day Off</h1>
      <p class="section-subtitle mx-auto mb-4" style="max-width:420px;">The page you're looking for doesn't exist or may have moved. Let's get you back to a healthy smile.</p>
      <a href="index.html" class="btn btn-primary-solid">Back to Home</a>
    </div>
  </div>
</body>
</html>
